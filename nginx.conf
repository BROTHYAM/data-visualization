server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects relative when running behind an HTTPS proxy.
    absolute_redirect off;

    # Resolve the Compose service dynamically if its container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/events {
        set $nasa_proxy nasa-api:8080;
        proxy_pass http://$nasa_proxy$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
