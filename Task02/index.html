<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🛒 Online Shop</h1>
    <p class="subtitle">Task 2 - Shopping Cart</p>
  </header>

  <main>
    <!-- Catalog -->
    <section class="panel" id="catalog-panel">
      <h2>Products</h2>
      <div id="products" class="products-grid"></div>
    </section>

    <!-- Cart -->
    <aside class="panel" id="cart-panel">
      <h2>Your Cart</h2>
      <div id="cart"></div>
      <div class="total-row">
        <span>Total:</span>
        <span id="total">$0.00</span>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
