services:
  web:
    image: data-visualization:local
    build:
      context: .
    restart: unless-stopped
    ports:
      # The host's HTTPS reverse proxy forwards requests to this local port.
      - "127.0.0.1:${APP_PORT:-9001}:80"
    depends_on:
      - nasa-api
  nasa-api:
    image: data-visualization:local
    pull_policy: never
    entrypoint: ["/usr/local/bin/nasa-proxy"]
    user: "65534:65534"
    restart: unless-stopped
    environment:
      NASA_API_KEY: ${NASA_API_KEY:-}
